[project]
name = "comps-pipeline"
version = "0.1.0"
description = "Comparable sales shortlisting pipeline for residential appraisal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6",
    "pydantic>=2.14.1,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "rapidfuzz>=3.14.6,<4.0.0",
]

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.17.2,<0.18.0",
]
