{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Comps Shortlist{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'app.css' %}?v=4.0.0">
</head>

<body>
  {% with page=request.resolver_match.url_name %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{% url 'new_run' %}">
        <span class="brand-text">Comps<span class="brand-thin">Shortlist</span></span>
      </a>
      <nav class="topnav" aria-label="Main navigation">
        <a href="{% url 'new_run' %}" class="topnav-link"{% if page == 'new_run' %} aria-current="page"{% endif %}>New run</a>
        <a href="{% url 'history' %}" class="topnav-link"{% if page == 'history' or page == 'results' %} aria-current="page"{% endif %}>Past runs</a>
        <a href="{% url 'how_it_works' %}" class="topnav-link"{% if page == 'how_it_works' %} aria-current="page"{% endif %}>How it works</a>
        <a href="{% url 'config' %}" class="topnav-link"{% if page == 'config' %} aria-current="page"{% endif %}>Settings</a>
      </nav>
    </div>
  </header>
  {% endwith %}
  <main class="app-main">{% block content %}{% endblock %}</main>
</body>

</html>
